schema_name: Ayagoz Taxi Map 2
schema_description: Ayagoz streets buildings addresses parks water and POIs from OpenStreetMap
attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>'
sources:
  osm:
    type: osm
    local_path: kazakhstan-261008.osm.pbf
layers:
  - id: landuse
    features:
      - source: osm
        geometry: polygon
        min_zoom: 12
        min_size: 0
        include_when:
          leisure: [park, garden, playground]
          landuse: [grass, forest, meadow, recreation_ground, cemetery]
          natural: [wood, grassland]
        attributes:
          - key: class
            value:
              coalesce:
                - tag_value: leisure
                - tag_value: landuse
                - tag_value: natural
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom: 10
        min_size: 0
        include_when:
          natural: water
          landuse: [reservoir, basin]
        attributes:
          - key: name
            tag_value: name
  - id: waterways
    features:
      - source: osm
        geometry: line
        min_zoom: 12
        min_size: 0
        include_when:
          waterway: [river, stream, canal, drain]
        attributes:
          - key: name
            tag_value: name
  - id: railways
    features:
      - source: osm
        geometry: line
        min_zoom: 12
        min_size: 0
        include_when:
          railway: [rail, light_rail]
  - id: roads
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        min_size: 0
        include_when:
          highway: __any__
        attributes:
          - key: class
            tag_value: highway
          - key: name
            tag_value: name
          - key: name_ru
            tag_value: name:ru
          - key: name_kk
            tag_value: name:kk
          - key: ref
            tag_value: ref
          - key: oneway
            tag_value: oneway
  - id: buildings
    features:
      - source: osm
        geometry: polygon
        min_zoom: 13
        min_size: 0
        include_when:
          building: __any__
        exclude_when:
          building: 'no'
        attributes:
          - key: class
            tag_value: building
          - key: housenumber
            tag_value: addr:housenumber
          - key: street
            tag_value: addr:street
          - key: name
            tag_value: name
  - id: addresses
    features:
      - source: osm
        geometry: polygon_point_on_surface
        min_zoom: 15
        include_when:
          addr:housenumber: __any__
        attributes: &address_attributes
          - key: housenumber
            tag_value: addr:housenumber
          - key: street
            tag_value: addr:street
          - key: place
            tag_value: addr:place
      - source: osm
        geometry: point
        min_zoom: 15
        include_when:
          addr:housenumber: __any__
        attributes: *address_attributes
  - id: places
    features:
      - source: osm
        geometry: point
        min_zoom: 10
        include_when:
          place: [city, town, village, hamlet, suburb, quarter, neighbourhood]
        attributes:
          - key: name
            tag_value: name
          - key: name_ru
            tag_value: name:ru
          - key: class
            tag_value: place
  - id: pois
    features:
      - source: osm
        geometry: point
        min_zoom: 15
        include_when:
          amenity: [hospital, clinic, doctors, pharmacy, school, kindergarten, police, fire_station, bank, atm, bus_station, post_office, restaurant, cafe, fuel, parking, marketplace]
          shop: [supermarket, convenience, bakery]
          tourism: [hotel, guest_house]
        attributes:
          - key: name
            tag_value: name
          - key: amenity
            tag_value: amenity
          - key: shop
            tag_value: shop
          - key: tourism
            tag_value: tourism
